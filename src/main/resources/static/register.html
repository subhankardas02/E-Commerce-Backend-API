<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce | Create Account</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Ambient Background Glows -->
<div class="bg-shape shape-1"></div>
<div class="bg-shape shape-2"></div>

<!-- Dynamic Toast Notification Container -->
<div id="toast" class="toast hidden"></div>

<div class="card fade-in">
    <div class="card-header">
        <h2>Initialize Account</h2>
        <p class="subtitle">Enter your credentials to access the grid.</p>
    </div>

    <form id="registerForm">
        <!-- Personal Information -->
        <div class="form-section">
            <h3>Personal Data</h3>
            <div class="form-grid">
                <div class="field">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="John" required>
                </div>
                <div class="field">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="Doe" required>
                </div>
                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>
                <div class="field">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="+1 (555) 000-0000" required>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Address Information -->
        <div class="form-section">
            <h3>Shipping Coordinates</h3>
            <div class="field full-width">
                <label for="street">Street Address</label>
                <input type="text" id="street" placeholder="123 Neon Sector, Apt 4B" required>
            </div>
            <div class="form-grid">
                <div class="field">
                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="Night City" required>
                </div>
                <div class="field">
                    <label for="state">State / Province</label>
                    <input type="text" id="state" placeholder="NC" required>
                </div>
                <div class="field">
                    <label for="country">Country</label>
                    <input type="text" id="country" placeholder="USA" required>
                </div>
                <div class="field">
                    <label for="zip_code">Zip Code</label>
                    <input type="text" id="zip_code" placeholder="10001" required>
                </div>
            </div>
        </div>

        <button type="submit" id="submitBtn">
            <span class="btn-text">Register Identity</span>
            <!-- SVG Loading Spinner -->
            <svg class="spinner hidden" viewBox="0 0 50 50">
                <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
            </svg>
        </button>
    </form>
</div>

<script src="js/register.js"></script>
</body>
</html>
